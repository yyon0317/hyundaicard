<body>
    
    <div id="guide" class="guide">
        <div class="layer">
            <div class="guide__title">Buttonffff</div>
            <div class="guide__desc">
                버튼은 가장 주요한 컴포넌트로 사용자의 작업수행을 위해 시각적 계층 구조를 만들었습니다. <br>
                계층 구조에 따른 스타일 가이드에 유의하여 목적에 맞게 사용하며, 임의 스타일 추가 및 사용은 제한합니다.
            </div>
            <div class="guide__content">
                <div class="guide__title2">Button Size</div>
                <div class="row margin-xs mbt-xl">
                    <div class="col-12">
                        <img src="../../assets/img/guide/button.png" alt="">
                    </div>
                </div>

                <div class="guide__title2">Button Default</div>
                <div class="guide__sample mbt-xl">
                    <div class="row margin-xl wrapper">
                        <div class="col-3">
                            <div class="types">Normal</div>
                            <button type="button" class="btn btn-block">Button Interaction</button>
                        </div>
                        <div class="col-3">
                            <div class="types">Hover</div>
                            <button type="button" class="btn btn-block active">Button Interaction</button>
                        </div>
                        <div class="col-3">
                            <div class="types">Active</div>
                            <button type="button" class="btn btn-block active">Button Interaction</button>
                        </div>
                        <div class="col-3">
                            <div class="types">Disabled</div>
                            <button type="button" class="btn btn-block" disabled>Button Interaction</button>
                        </div>
                    </div>
                </div>

                <div class="guide__title2">Button Solid</div>
                <div class="guide__sample">
                    <div class="row margin-xl wrapper">
                        <div class="col-3">
                            <div class="types">Normal</div>
                            <button type="button" class="btn btn-solid btn-block">Button Interaction</button>
                        </div>
                        <div class="col-3">
                            <div class="types">Hover</div>
                            <button type="button" class="btn btn-solid btn-block active">Button Interaction</button>
                        </div>
                        <div class="col-3">
                            <div class="types">Active</div>
                            <button type="button" class="btn btn-solid btn-block active">Button Interaction</button>
                        </div>
                        <div class="col-3">
                            <div class="types">Disabled</div>
                            <button type="button" class="btn btn-solid btn-block" disabled>Button Interaction</button>
                        </div>
                    </div>
                </div>

                
                
            </div>
        </div>
        
    </div>
